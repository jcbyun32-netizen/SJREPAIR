<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>SJ Repair 증빙 사진</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--mw:28rem;--ink:#3b4854;--brand:#00ab6b;--bg:#eef1f3;--card:#fff;--line:#cbd5e1;--mute:#64748b;--soft:#f1f5f9;--danger:#dc2626}
html,body{margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;touch-action:manipulation;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
header{background:var(--card);border-bottom:4px solid var(--brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.wrap{max-width:var(--mw);margin:0 auto;padding:0 1rem}
.hd{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.4rem}
.hd img{height:2.25rem;width:auto;background:#fff;border-radius:4px}
.sm{font-size:.875rem;font-weight:600;padding:.5rem .75rem;border-radius:.5rem;background:var(--soft);color:var(--mute)}
main{max-width:var(--mw);margin:0 auto;padding:1rem 1rem 1.5rem}
.card{background:var(--card);border-radius:1rem;padding:1.25rem;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:.75rem}
h1{font-size:2.1rem;line-height:1.25;font-weight:800;margin:0 0 .5rem}
.sub{font-size:.875rem;color:var(--mute);margin:0 0 1.25rem}
.lb{font-size:.875rem;font-weight:700;margin:0 0 .5rem;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.pf{height:4rem;border-radius:.75rem;font-size:1.5rem;font-weight:800;border:2px solid var(--line);color:var(--mute);background:var(--card)}
.pf.on{background:var(--brand);color:#fff;border-color:transparent}
.in{width:100%;height:3.5rem;padding:0 .75rem;font-size:1.2rem;border-radius:.75rem;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.in:focus,.ta:focus{border-color:var(--brand)}
.row{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem}
.pre{font-size:1.5rem;font-weight:800}
.big{width:100%;height:4rem;border-radius:.75rem;background:var(--brand);color:#fff;font-size:1.2rem;font-weight:800}
.big.dark{background:#334155}
.big.red{background:var(--danger)}
.big:disabled,.mid:disabled{opacity:.4}
.mid{width:100%;height:3rem;border-radius:.75rem;font-weight:700;background:var(--card);border:2px solid var(--line)}
.err{white-space:pre-line;color:var(--danger);font-size:.875rem;font-weight:600;margin:.75rem 0 0}
.serial{font-size:1.5rem;font-weight:800}
.meta{font-size:.875rem;color:var(--mute)}
.count{display:flex;align-items:center;justify-content:space-between}
.bar{height:.5rem;background:var(--soft);border-radius:9999px;overflow:hidden;margin-top:.6rem}
.bar i{display:block;height:100%;background:var(--brand)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
.cam{height:4.5rem;border-radius:.75rem;font-weight:800;font-size:1.05rem;color:#fff;background:var(--brand);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.cam:active{transform:translateY(4px);box-shadow:none}
.cam.alt{background:#334155}
.cam:disabled{opacity:.35;box-shadow:none}
.ph{padding:.75rem}
.ph .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.ph .no{font-weight:800}
.ph .del{font-size:.8rem;font-weight:700;color:var(--danger);padding:.35rem .6rem;border-radius:.5rem;background:var(--soft)}
.ph img{width:100%;border-radius:.6rem;display:block;max-height:22rem;object-fit:contain;background:#0001}
.ta{width:100%;margin-top:.6rem;min-height:4.5rem;padding:.6rem .75rem;font:inherit;font-size:1rem;border-radius:.75rem;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none;resize:vertical}
.empty{text-align:center;color:var(--mute);padding:2rem 1rem;border:2px dashed var(--line);border-radius:1rem;margin-bottom:.75rem}
.btns{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 4.75rem)}
.next{margin-top:.6rem;height:2.75rem;border-color:var(--brand);color:var(--brand)}
@media (min-width:700px){:root{--mw:40rem}}
.fit{position:fixed;top:0;left:0;right:0;min-height:0;height:100vh;height:var(--app-h,100vh);display:flex;flex-direction:column;overflow:hidden}
.fit header .hd{padding:.4rem 1.4rem}.fit header .hd img{height:2rem}
.fit main{flex:1;min-height:0;overflow-y:auto;width:100%;display:flex;flex-direction:column;padding-top:.5rem;padding-bottom:.5rem}
.pg{flex:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"stat" "ttl" "vp" "acts" "ta" "foot";grid-template-rows:auto auto auto auto auto auto;align-content:start;gap:.5rem}
.pg>.stat{grid-area:stat}.pg>.ttl{grid-area:ttl}.pg>.acts{grid-area:acts}.pg>.ta{grid-area:ta}
.foot{grid-area:foot;position:sticky;bottom:0;display:grid;gap:.5rem;background:var(--bg);padding-top:.25rem}
@media (min-aspect-ratio:5/4){
  :root{--mw:64rem}
  .pg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"vp stat" "vp ttl" "vp acts" "vp ta" "vp foot";grid-template-rows:auto auto auto auto 1fr;column-gap:.75rem}
  .foot{align-self:end}
  .pg .ta{height:3rem}
}
.stat{display:flex;align-items:center;justify-content:space-between;padding:.55rem .85rem;margin:0}
.sn{font-size:1.1rem;font-weight:800}.pn{font-size:1.1rem;font-weight:800;color:var(--brand)}
.ttl{font-weight:800;font-size:1rem}
.vp{grid-area:vp;height:18rem;position:relative;background:var(--soft);border-radius:.75rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vp img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:block}
.emp{text-align:center;color:var(--mute);padding:1rem;width:100%;height:100%;display:flex;flex-direction:column}
.emp>div:first-child{flex:1;display:flex;align-items:center;justify-content:center;line-height:1.5;margin:0}
.cbtns{display:grid;gap:.6rem}
.acts,.nav{display:grid;gap:.5rem}
.acts{grid-template-columns:1.3fr 1fr .8fr}.nav{grid-template-columns:1fr 1fr}
.acts .mid,.nav .mid{height:2.75rem;font-size:.9rem}
.dl{color:var(--danger)}
.pg .ta{margin-top:0;min-height:0;height:3.5rem;resize:none}
.fin{height:3.25rem;font-size:1.1rem}
.fit .nav{margin:0}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);display:grid;gap:.5rem;padding-top:.25rem}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.5rem;display:block}
.th p{margin:.25rem 0 0;font-size:.8rem;color:var(--mute);white-space:pre-wrap;word-break:break-all}
.ok{color:var(--brand);font-weight:800}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.dlg{background:var(--card);border-radius:1rem;padding:1.25rem;width:100%;max-width:24rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.2)}
.dlg p{white-space:pre-line;font-weight:600;margin:0 0 1rem}
.dlg div{display:flex;gap:.5rem}
.dlg button{flex:1;height:3rem;border-radius:.75rem;font-weight:700;background:var(--soft)}
.dlg button.p{background:var(--brand);color:#fff}
.ttl.ref{display:flex;gap:.6rem;align-items:center}
.rimg{width:5.5rem;height:4.1rem;object-fit:cover;border-radius:.5rem;flex:none;background:var(--soft)}
.ttl.ref .meta{font-weight:600;word-break:break-all;margin-top:.15rem}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:.25rem}
.pr img,.pr .nn{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.5rem;display:block}
.nn{display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--mute);font-size:.75rem}
.vp2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;background:none;border-radius:0;overflow:visible;align-items:stretch;justify-content:stretch}
.vp2 .pane{position:relative;background:var(--soft);border-radius:.75rem;overflow:hidden;min-width:0;min-height:0}
.vp2 .pane img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
.pl{position:absolute;top:.35rem;left:.35rem;z-index:2;font-size:.75rem;font-weight:800;background:rgba(220,38,38,.9);color:#fff;padding:.15rem .55rem;border-radius:9999px}
.pl.g{background:rgba(0,171,107,.92)}
.vp2 .emp{padding:.5rem}
.vp2 .emp>div:first-child{font-size:.9rem}
.vp2 .cam{height:3.2rem;font-size:.9rem}
</style>
</head>

<main id="app"></main>

<script>
const KEY='ls_sj_rework_v1', NAME_KEY='ls_sj_inspector_v1', MAX=30;
let S={screen:'start',phase:'before',inspector:'',prefix:'MEC00905',rest:'',page:0,photos:[]};
const doneN=()=>S.photos.filter(p=>p.after).length;

function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function load(){
  try{const j=safeGet(KEY);if(j){const o=JSON.parse(j);if(o&&Array.isArray(o.photos))S=Object.assign(S,o)}}catch(e){}
  const n=safeGet(NAME_KEY); if(n&&!S.inspector) S.inspector=n;
}
let warned=false;
function save(){
  if(!safeSet(KEY,JSON.stringify(S))&&!warned){warned=true;tell('브라우저 저장 공간이 부족해 임시저장이 되지 않습니다.\n이 페이지를 닫지 말고 계속 진행해 주세요.')}
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const PREFIXES=['MEC00905','MEC00907'];
const cleanRest=v=>String(v||'').toUpperCase().replace(/^\s*AEA/,'').replace(/[^0-9]/g,'');
const serial=()=>S.prefix+'-AEA'+S.rest.trim();

function ask(msg,okText,cancelText){
  okText=okText||'확인';
  return new Promise(res=>{
    const d=document.createElement('div');d.className='ov';
    d.innerHTML='<div class="dlg"><p></p><div></div></div>';
    d.querySelector('p').textContent=msg;
    const row=d.querySelector('div div');
    const done=v=>{d.remove();res(v)};
    if(cancelText!==null){const c=document.createElement('button');c.textContent=cancelText||'취소';c.onclick=()=>done(false);row.appendChild(c)}
    const o=document.createElement('button');o.className='p';o.textContent=okText;o.onclick=()=>done(true);row.appendChild(o);
    document.body.appendChild(d);
  });
}
const tell=m=>ask(m,'확인',null);

function render(){
  document.body.classList.toggle('fit',S.screen==='shoot'||S.screen==='after');
  $('resetBtn').style.display=S.screen==='start'?'none':'';
  if(S.screen==='start')return renderStart();
  if(S.screen==='shoot')return renderShoot();
  if(S.screen==='after')return renderAfter();
  renderReview();
}

/* ---------- 1. 시작 화면 ---------- */
function renderStart(){
  const n=S.photos.length,resume=n>0&&S.rest.trim();
  $('app').innerHTML=`
  <section class="card">
    <h1>SJ Repair 증빙 사진</h1>
    <p class="sub">작업자와 시리얼 넘버를 입력하세요.<br>① 지적 사진 촬영 → 재작업 → ② 완료 사진 촬영 순서로 진행합니다.</p>
    <label class="lb" for="insp">작업자 이름</label>
    <input id="insp" class="in" style="margin-bottom:1.25rem" type="text" autocomplete="name" placeholder="예: 홍길동" value="${esc(S.inspector)}" oninput="S.inspector=this.value;safeSet(NAME_KEY,this.value);save()">
    <div class="lb">시리얼 접두사</div>
    <div class="grid2">
      ${PREFIXES.map(p=>`<button class="pf ${S.prefix===p?'on':''}" onclick="setPrefix('${p}')">${p}</button>`).join('')}
    </div>
    <label class="lb" for="rest">시리얼 번호 (AEA 뒤 숫자)</label>
    <div class="row">
      <span class="pre" style="font-size:1.05rem;white-space:nowrap">${S.prefix}-AEA</span>
      <input id="rest" class="in" style="flex:1;min-width:0" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="숫자 입력" value="${esc(S.rest)}" oninput="S.rest=cleanRest(this.value);this.value=S.rest;save()">
    </div>
    <button class="big red" onclick="startInspect()">Repair 대상 촬영 시작</button>
    <p id="err" class="err" style="display:none"></p>
  </section>
  ${resume?`<section class="card">
    <div style="font-weight:700;margin-bottom:.25rem">진행 중인 작업이 있습니다</div>
    <div class="meta" style="margin-bottom:.75rem">${esc(serial())} · 지적 ${n}건 · 완료 ${doneN()}건</div>
    <button class="big dark" style="height:3rem;font-size:1rem" onclick="continueWork()">${S.phase==='after'?'이어서 Repair 완료 촬영':'이어서 Repair 대상 촬영'}</button>
  </section>`:''}`;
}
function setPrefix(p){S.prefix=p;save();renderStart()}
function continueWork(){S.screen=S.phase==='after'?'after':'shoot';if(S.phase==='after')S.page=0;save();render();window.scrollTo(0,0)}
async function startInspect(){
  const e=$('err');
  if(!S.inspector.trim()){e.textContent='작업자 이름을 입력해 주세요.';e.style.display='';$('insp').focus();return}

function fileToPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const M=1024,r=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({data:c.toDataURL('image/jpeg',0.7),w,h,comment:'',after:null});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
    img.src=url;
  });
}
async function addFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';
  if(!f)return;
  let ph;
  try{ph=await fileToPhoto(f)}catch(e){await tell('사진을 불러오지 못했습니다.');return}
  if(S.screen==='after'){
    const p=S.photos[S.page];if(!p)return;
    p.after={data:ph.data,w:ph.w,h:ph.h};
    save();renderAfter();return;
  }
  if(S.page<S.photos.length){const o=S.photos[S.page];ph.comment=o.comment||'';ph.after=o.after||null;S.photos[S.page]=ph}
  else{
    if(S.photos.length>=MAX){await tell('지적 사진은 최대 '+MAX+'장까지 등록할 수 있습니다.');return}
    S.photos.push(ph);S.page=S.photos.length-1;
  }
  save();renderShoot();
  const t=$('cmt');if(t)try{t.focus({preventScroll:true})}catch(e){}
}
function busy(msg){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML='<div class="dlg"><p style="margin:0;text-align:center"></p></div>';
  d.querySelector('p').textContent=msg;document.body.appendChild(d);

}
async function addFiles(inp){
  const files=Array.from(inp.files||[]);inp.value='';
  if(!files.length)return;
  const room=MAX-S.photos.length;
  if(room<=0){await tell('지적 사진은 최대 '+MAX+'장까지 등록할 수 있습니다.');return}
  const use=files.slice(0,room);
  const first=S.photos.length;
  const done=busy('사진 처리 중... ('+use.length+'장)');
  let added=0,failed=0;
  for(const f of use){
    try{S.photos.push(await fileToPhoto(f));added++}catch(e){failed++}
  }
  done();
  if(added){S.page=first;save();renderShoot();const t=$('cmt');if(t)try{t.focus({preventScroll:true})}catch(e){}}
  const msg=[];
  if(files.length>room)msg.push('최대 '+MAX+'장까지만 등록됩니다.\n초과한 '+(files.length-room)+'장은 제외되었습니다.');
  if(failed)msg.push(failed+'장은 불러오지 못했습니다.');
  if(msg.length)await tell(msg.join('\n'));
}

/* ---------- 엑셀 생성 (사진 삽입) ---------- */
function crc32(buf){
  if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)crc=crc32.t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const enc=new TextEncoder(),chunks=[],central=[];
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=f.bin||enc.encode(f.text),crc=crc32(data),size=data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);
    chunks.push(lh,name,data);central.push({name,crc,size,offset});offset+=lh.length+name.length+size;
  }
  const cdStart=offset;
  for(const c of central){
    const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)]);
    chunks.push(h,c.name);offset+=h.length+c.name.length;
  }
  chunks.push(new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(central.length),...u16(central.length),...u32(offset-cdStart),...u32(cdStart),...u16(0)]));
  return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function b64ToBytes(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

  xf(0,0,'horizontal="left" vertical="top" wrapText="1"')+
  xf(0,0,'horizontal="center" vertical="center"')+
  '</cellXfs></styleSheet>';
}
function drawingXml(){
  const E=9525;
  let a='';
  picList().forEach((p,k)=>{
    const m=Math.min(BOX_W/p.w,BOX_H/p.h), w=Math.round(p.w*m), h=Math.round(p.h*m);
    const cx=w*E, cy=h*E, ox=Math.round((COLB_PX-w)/2)*E, oy=Math.max(0,Math.round((ROWPX-h)/2))*E;
    a+=`<xdr:oneCellAnchor><xdr:from><xdr:col>${p.col}</xdr:col><xdr:colOff>${ox}</xdr:colOff><xdr:row>${FIRST-1+p.row}</xdr:row><xdr:rowOff>${oy}</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${k+2}" name="${xe(p.name)}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId${k+1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`;
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+a+'</xdr:wsDr>';
}
function buildXlsxBlob(){
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const PK='http://schemas.openxmlformats.org/package/2006/relationships';
  const files=[
    {name:'[Content_Types].xml',text:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>'},
    {name:'_rels/.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',text:H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="SJ 재작업" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',text:stylesXml()},
    {name:'xl/worksheets/sheet1.xml',text:sheetXml()},
    {name:'xl/worksheets/_rels/sheet1.xml.rels',text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/drawing" Target="../drawings/drawing1.xml"/></Relationships>`},
    {name:'xl/drawings/drawing1.xml',text:drawingXml()},
    {name:'xl/drawings/_rels/drawing1.xml.rels',text:H+`<Relationships xmlns="${PK}">`+picList().map((p,i)=>`<Relationship Id="rId${i+1}" Type="${R}/image" Target="../media/image${i+1}.jpeg"/>`).join('')+'</Relationships>'}
  ];
  picList().forEach((p,i)=>files.push({name:`xl/media/image${i+1}.jpeg`,bin:b64ToBytes(p.d)}));
  return makeZip(files);
}
const fileBase=()=>'SJ_'+serial().replace(/[\\/:*?"<>|\s]/g,'_')+'_재작업';
function downloadXlsx(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(buildXlsxBlob());
  a.download=fileBase()+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

function setH(){const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight;document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');fitVp()}
function fitVp(){
  const vp=document.querySelector('.vp'),pg=document.querySelector('.pg'),m=$('app');
  if(!vp||!pg||!m||S.screen!=='shoot'&&S.screen!=='after')return;
  const cs=getComputedStyle(m),inner=m.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const land=window.matchMedia&&window.matchMedia('(min-aspect-ratio: 5/4)').matches;
  let h;
  if(land){h=inner}
  else{vp.style.height='0px';const rest=pg.offsetHeight;h=Math.max(112,Math.min(inner-rest,pg.clientWidth*1.34))}
  vp.style.height=Math.round(h)+'px';
}
setH();window.addEventListener('resize',setH);window.addEventListener('orientationchange',()=>setTimeout(setH,200));
if(window.visualViewport){window.visualViewport.addEventListener('resize',setH)}
load();
if(!PREFIXES.includes(S.prefix))S.prefix=PREFIXES[0];
S.rest=cleanRest(S.rest);
if(S.screen!=='start'&&!(S.rest&&S.rest.trim()))S.screen='start';
render();
</script>
